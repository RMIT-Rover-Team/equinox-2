<html>

<body>


    <h1>WebSocket Control Interface</h1>
    <p>This Page is purely for testing purposes</p>

    <button id="enable">Enable</button>
    <button id="disable">Disable</button>
    <button id="calibrate">Calibrate</button>
    <button id="stop">Stop</button>
    <button id="estop">ESTOP</button>

    <select id="mode" value="Unlocked">
        <option value="Unlocked">Unlocked</option>
        <option value="Locked">Locked</option>
        <option value="Torque">Torque</option>
    </select>

    <br>
    <label for="left_speed">Left Speed:</label>
    <input type="range" id="left_speed" min="-250" max="250" value="0">
    <br>
    <label for="right_speed">Right Speed:</label>
    <input type="range" id="right_speed" min="-250" max="250" value="0">
    <br>
    <label for="master">Master Speed:</label>
    <input type="range" id="master" min="-250" max="250" value="0">
    <br>

    <b id="odom">ODOM</b>

    <script>
        const commandChannel = new WebSocket("ws://localhost:5001/driveChannel");

        commandChannel.onopen = function () {
            console.log('Connected to Command Channel');
        };

        commandChannel.onmessage = function (event) {
            console.log('Message from server: ', event.data);
            document.getElementById("odom").innerText = event.data;
        };

        document.getElementById('enable').addEventListener('click', function () {
            commandChannel.send(JSON.stringify({ 'command': 'enable' }));
        });

        document.getElementById('disable').addEventListener('click', function () {
            commandChannel.send(JSON.stringify({ 'command': 'disable' }));
        });

        document.getElementById('calibrate').addEventListener('click', function () {
            commandChannel.send(JSON.stringify({ 'command': 'calibrate' }));
        });

        document.getElementById('stop').addEventListener('click', function () {
            commandChannel.send(JSON.stringify({ 'command': 'stop' }));
        });

        document.getElementById('estop').addEventListener('click', function () {
            commandChannel.send(JSON.stringify({ 'command': 'estop' }));
        });

        document.getElementById('mode').addEventListener('change', function () {
            if (this.value == "Torque") {
                if (confirm("ARE YOU SURE YOU WANNA RIDE THIS TRAIN? ;) \nWhat could possibly go wrong?")) {
                    if (confirm("Positive? I won't stop you")) {
                        commandChannel.send(JSON.stringify({ 'command': 'set_mode', 'mode': this.value }));
                    }
                }
            }
            else {
                commandChannel.send(JSON.stringify({ 'command': 'set_mode', 'mode': this.value }));
            }

        });

        document.getElementById('left_speed').addEventListener('input', function () {
            commandChannel.send(JSON.stringify({ 'command': 'set_speed', 'left': document.getElementById('left_speed').value, 'right': document.getElementById('right_speed').value }));
        });

        document.getElementById('right_speed').addEventListener('input', function () {
            commandChannel.send(JSON.stringify({ 'command': 'set_speed', 'left': document.getElementById('left_speed').value, 'right': document.getElementById('right_speed').value }));
        });

        document.getElementById('master').addEventListener('input', function () {
            document.getElementById('left_speed').value = document.getElementById('master').value;
            document.getElementById('right_speed').value = document.getElementById('master').value;
            commandChannel.send(JSON.stringify({ 'command': 'set_speed', 'left': document.getElementById('left_speed').value, 'right': document.getElementById('right_speed').value }));
        });
    </script>



    <script>


    </script>

</body>

</html>
