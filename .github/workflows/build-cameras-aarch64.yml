name: Build ARM64 camera package

on:
  push:
    branches: [feat/cameras-backend-rs]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "onboard/cameras/**"
      - ".github/workflows/build-cameras-aarch64.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "onboard/cameras/**"
      - ".github/workflows/build-cameras-aarch64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nix closure (aarch64-linux)
    # This builds natively, avoiding a long GStreamer cross-compilation.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build the camera package
        run: nix build --print-build-logs .#eq2-cameras

      - name: Export the complete Nix closure
        shell: bash
        run: |
          set -euo pipefail
          nix-store --export $(nix-store --query --requisites ./result) | zstd -T0 -19 -o eq2-cameras-aarch64.nar.zst
          sha256sum eq2-cameras-aarch64.nar.zst > eq2-cameras-aarch64.nar.zst.sha256
          printf '%s\n' \
            '# Copy this file to eq2-cameras.env on the Raspberry Pi, then set real values.' \
            '# Do not commit eq2-cameras.env: the token grants access to your LiveKit room.' \
            '' \
            '# WebSocket endpoint of the LiveKit server reachable from the rover.' \
            "export LIVEKIT_WS_URL='ws://livekit-hostname-or-ip:7880'" \
            '' \
            '# A LiveKit JWT for this camera identity with canPublish=true.' \
            "export LIVEKIT_AUTH_TOKEN='replace-with-a-livekit-jwt'" \
            > eq2-cameras.env.example
          printf '%s\n' \
            'Import on the Raspberry Pi with:' \
            '  zstd -dc eq2-cameras-aarch64.nar.zst | nix-store --import' \
            '' \
            'Configure and load LiveKit credentials:' \
            '  cp eq2-cameras.env.example eq2-cameras.env' \
            '  chmod 600 eq2-cameras.env' \
            '  # Edit eq2-cameras.env, then run:' \
            '  set -a; . ./eq2-cameras.env; set +a' \
            '' \
            'Then run the printed /nix/store/...-eq2-cameras/bin/eq2-cameras path.' \
            > README.txt
          du -h eq2-cameras-aarch64.nar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: eq2-cameras-aarch64-nix-closure
          path: |
            eq2-cameras-aarch64.nar.zst
            eq2-cameras-aarch64.nar.zst.sha256
            eq2-cameras.env.example
            README.txt
          if-no-files-found: error
          retention-days: 14
          # The closure is already zstd-compressed. Avoid spending time trying
          # to ZIP-compress it again; that does not make the download smaller.
          compression-level: 0
